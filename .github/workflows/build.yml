name: Build & Test

on:
  push:
    # All Canopi v2 work lands on feature/geolibre-adoption (AGENTS.md), so the
    # gates run there as well as on main.
    branches: [main, feature/geolibre-adoption]
  pull_request:
    branches: [main, feature/geolibre-adoption]

# A newer push or PR update cancels the older run of the same ref; main always finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Rust caches are saved only from main and the v2 branch, whose caches every
  # PR and later push can restore; PR refs restore without adding copies.
  SAVE_RUST_CACHE: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/geolibre-adoption') }}
  CANOPI_CORE_DB_RELEASE_TAG: canopi-core-db

jobs:
  # Docs, bead and design-board changes run only lint (which checks the docs);
  # the tests, LiDAR lanes and installer builds run when anything else changed.
  # A same-repo PR from main or the v2 branch (PR 33) runs nothing: the push
  # run already checks its head commit and saves the caches a PR run cannot.
  changes:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository ||
      (github.head_ref != 'main' && github.head_ref != 'feature/geolibre-adoption')
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
      packaging: ${{ steps.packaging.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE" "$GITHUB_SHA" | grep -qvE '^(docs/|\.beads/|\.interface-design/)|\.md$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
      # Feature-branch pushes package Linux and Apple silicon only, unless they
      # change a packaging input (manifests, build script, Tauri config, the
      # sidecar and its smoke, the Windows manifest check, npm manifests, CI);
      # then, like pushes to main, pull requests and Release Candidate, all four.
      - id: packaging
        env:
          FEATURE_PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/feature/geolibre-adoption' }}
          BASE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          all='[
            {"os": "ubuntu-latest", "target": "x86_64-unknown-linux-gnu", "bundle_args": "--bundles deb"},
            {"os": "macos-14", "target": "aarch64-apple-darwin", "bundle_args": ""},
            {"os": "macos-15-intel", "target": "x86_64-apple-darwin", "bundle_args": ""},
            {"os": "windows-latest", "target": "x86_64-pc-windows-msvc", "bundle_args": ""}
          ]'
          inputs='^(Cargo\.lock$|desktop/Cargo\.toml$|desktop/build\.rs$|desktop/tauri[^/]*\.json$|desktop/tauri\.conf|desktop/binaries/|scripts/build-geolibre-cli\.sh$|scripts/smoke-bundled-sidecar\.sh$|scripts/check_windows_manifest\.py$|desktop/web/package[^/]*\.json$|\.github/)'
          filter='.'
          if [ "$FEATURE_PUSH" = true ] && [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            changed="$(git diff --name-only "$BASE" "$GITHUB_SHA")"
            if ! grep -qE "$inputs" <<<"$changed"; then
              filter='map(select(.os == "ubuntu-latest" or .os == "macos-14"))'
            fi
          fi
          echo "matrix=$(jq -c "$filter" <<<"$all")" >> "$GITHUB_OUTPUT"

  lint:
    needs: changes
    runs-on: ubuntu-latest
    env:
      CANOPI_SKIP_BUNDLED_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Documentation links and lifecycle
        run: |
          python3 -m unittest scripts.test_check_docs
          python3 scripts/check_docs.py
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: lint
          cache-on-failure: false
          save-if: ${{ env.SAVE_RUST_CACHE == 'true' }}

      - name: Install Linux dependencies
        uses: ./.github/actions/install-linux-deps

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Unused crates
        run: |
          python3 -m unittest scripts.test_check_unused_crates
          python3 scripts/check_unused_crates.py

      - name: Species Catalog contract tests
        run: python3 -m unittest scripts.test_species_search_normalization scripts.test_species_catalog_contract scripts.test_prepare_db scripts.test_web_catalog_artifact_contract scripts.test_generate_web_catalog

      - name: Check Species Search Unicode facts
        run: python3 scripts/species_search_unicode_facts.py check

      - name: Species Catalog contract check
        run: python3 scripts/species_catalog_contract.py check

      - name: Release promotion tests
        run: python3 -m unittest scripts.test_promote_release

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/web/package-lock.json

      - name: Install frontend deps
        run: npm ci --prefix desktop/web

      - name: Check generated transport bindings
        run: npm run check:types --prefix desktop/web

      - name: TypeScript check
        run: npx --prefix desktop/web tsc --noEmit -p desktop/web/tsconfig.json

      - name: UI gallery TypeScript check
        run: npm run check:ui --prefix desktop/web

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      CANOPI_SKIP_BUNDLED_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: test
          cache-on-failure: false
          save-if: ${{ env.SAVE_RUST_CACHE == 'true' }}

      - name: Install Linux dependencies
        uses: ./.github/actions/install-linux-deps

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      # `cargo cov` (.cargo/config.toml) runs the workspace tests instrumented
      # and fails below the recorded coverage floor.
      - name: Rust tests with coverage ratchet
        run: cargo cov

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/web/package-lock.json

      - name: Install frontend deps
        run: npm ci --prefix desktop/web

      - name: Geolocation precision and round-trip suite
        working-directory: desktop/web
        run: >-
          npx vitest run
          src/__tests__/session-plane.test.ts
          src/__tests__/geolocated-design-codec.test.ts
          src/canvas/runtime/scene-runtime/reorigin.test.ts
          src/__tests__/new-design-view.test.ts

      - name: Frontend source-policy tests (the coverage run leaves them out)
        run: npm run test:policies --prefix desktop/web

      - name: Frontend coverage ratchet
        run: npm run test:coverage --prefix desktop/web

      - name: Frontend build
        run: npm run build --prefix desktop/web

      - name: Web Edition build and browser-boundary scan
        run: npm run build:web --prefix desktop/web

  lidar-native:
    # GeoLibre-backed LiDAR lanes (ignored in the default suite); the engine
    # comparison lane skips itself here, as CI installs no GDAL. Fixture e2e
    # lanes stay local: they need IGN tiles.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    env:
      CANOPI_SKIP_BUNDLED_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: lidar-native
          cache-on-failure: false
          save-if: ${{ env.SAVE_RUST_CACHE == 'true' }}

      - name: Install Linux dependencies
        uses: ./.github/actions/install-linux-deps

      - uses: ./.github/actions/build-geolibre-cli

      - name: LiDAR native lanes
        run: |
          CANOPI_GEOLIBRE_BIN="$PWD/desktop/binaries/geolibre-$(rustc -vV | sed -n 's/^host: //p')"
          export CANOPI_GEOLIBRE_BIN
          cargo test -p canopi-desktop --lib --locked services::lidar -- --ignored --test-threads=1 --skip e2e_

  # The test job runs the suite on Linux only. File saving, atomic replace,
  # directory sync, locking and paths differ on Windows and macOS, so the
  # native tests run there too, on every code change, beside packaging.
  platform-tests:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    env:
      CANOPI_SKIP_BUNDLED_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: platform-tests-${{ matrix.target }}
          cache-on-failure: false
          save-if: ${{ env.SAVE_RUST_CACHE == 'true' }}

      - name: Rust tests on this platform
        shell: bash
        run: cargo test --workspace --locked --target ${{ matrix.target }}

  # Packaging runs beside lint and the tests rather than after them, so CI
  # artifacts do not wait for (or depend on) the test results; Release
  # Candidate keeps its own preflight gate.
  build:
    needs: changes
    if: >-
      needs.changes.outputs.code == 'true' &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.packaging) }}

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: release-${{ matrix.target }}
          cache-on-failure: false
          save-if: ${{ env.SAVE_RUST_CACHE == 'true' }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        uses: ./.github/actions/install-linux-deps

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/web/package-lock.json

      - name: Install frontend deps
        run: npm ci --prefix desktop/web

      - name: Download bundled plant DB
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          asset_name="$(python3 scripts/species_catalog_contract.py value prepared-db-asset-name)"
          download_dir="$(mktemp -d)"
          trap 'rm -rf "$download_dir"' EXIT
          mkdir -p desktop/resources
          gh release download "$CANOPI_CORE_DB_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$asset_name" \
            --dir "$download_dir"
          test -s "$download_dir/$asset_name"
          mv "$download_dir/$asset_name" desktop/resources/canopi-core.db

      - name: Verify bundled plant DB contract
        shell: bash
        run: >-
          python scripts/species_catalog_contract.py verify-db
          --profile prepared
          desktop/resources/canopi-core.db

      # The sidecar must exist before `tauri build`: build.rs bundles it only
      # when desktop/binaries holds it for the target (the runner's host).
      - uses: ./.github/actions/build-geolibre-cli

      - name: Build Tauri app
        run: npx --prefix desktop/web @tauri-apps/cli build --target ${{ matrix.target }} ${{ matrix.bundle_args }} -- --locked

      - name: Windows app selects Common Controls v6
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python -m pip install --quiet pefile
          exe=""
          for name in canopi-desktop.exe Canopi.exe; do
            if [ -f "target/${{ matrix.target }}/release/$name" ]; then exe="target/${{ matrix.target }}/release/$name"; break; fi
          done
          test -n "$exe" || { echo "no Canopi executable under target/${{ matrix.target }}/release" >&2; exit 1; }
          python scripts/check_windows_manifest.py "$exe"

      - name: Packaged sidecar runs from the installed layout
        shell: bash
        run: scripts/smoke-bundled-sidecar.sh ${{ matrix.target }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: canopi-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/bundle/**/*.deb
            target/${{ matrix.target }}/release/bundle/**/*.AppImage
            target/${{ matrix.target }}/release/bundle/**/*.dmg
            target/${{ matrix.target }}/release/bundle/**/*.msi
            target/${{ matrix.target }}/release/bundle/**/*.exe
          if-no-files-found: error
