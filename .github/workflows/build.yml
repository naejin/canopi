name: Build & Test

on:
  push:
    # All Canopi v2 work lands on feature/geolibre-adoption (AGENTS.md), so the
    # gates run there as well as on main.
    branches: [main, feature/geolibre-adoption]
  pull_request:
    branches: [main, feature/geolibre-adoption]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CANOPI_CORE_DB_RELEASE_TAG: canopi-core-db

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      CANOPI_SKIP_BUNDLED_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Documentation links and lifecycle
        run: |
          python3 -m unittest scripts.test_check_docs
          python3 scripts/check_docs.py
      - id: rust-toolchain
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - uses: ./.github/actions/cache-rust
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.cachekey }}
          workload: lint

      - name: Install Linux dependencies
        uses: ./.github/actions/install-linux-deps

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Species Catalog contract tests
        run: python3 -m unittest scripts.test_species_search_normalization scripts.test_species_catalog_contract scripts.test_prepare_db scripts.test_web_catalog_artifact_contract scripts.test_generate_web_catalog

      - name: Check Species Search Unicode facts
        run: python3 scripts/species_search_unicode_facts.py check

      - name: Species Catalog contract check
        run: python3 scripts/species_catalog_contract.py check

      - name: Release promotion tests
        run: python3 -m unittest scripts.test_promote_release

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/web/package-lock.json

      - name: Install frontend deps
        run: npm ci --prefix desktop/web

      - name: Check generated transport bindings
        run: npm run check:types --prefix desktop/web

      - name: TypeScript check
        run: npx --prefix desktop/web tsc --noEmit -p desktop/web/tsconfig.json

      - name: UI gallery TypeScript check
        run: npm run check:ui --prefix desktop/web

  test:
    runs-on: ubuntu-latest
    env:
      CANOPI_SKIP_BUNDLED_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - id: rust-toolchain
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: llvm-tools-preview
      - uses: ./.github/actions/cache-rust
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.cachekey }}
          workload: test

      - name: Install Linux dependencies
        uses: ./.github/actions/install-linux-deps

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      # `cargo cov` (.cargo/config.toml) runs the workspace tests instrumented
      # and fails below the recorded coverage floor.
      - name: Rust tests with coverage ratchet
        run: cargo cov

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/web/package-lock.json

      - name: Install frontend deps
        run: npm ci --prefix desktop/web

      - name: Geolocation precision and round-trip suite
        working-directory: desktop/web
        run: >-
          npx vitest run
          src/__tests__/session-plane.test.ts
          src/__tests__/geolocated-design-codec.test.ts
          src/canvas/runtime/scene-runtime/reorigin.test.ts
          src/__tests__/new-design-view.test.ts

      - name: Frontend tests
        run: npm test --prefix desktop/web

      - name: Frontend coverage ratchet
        run: npm run test:coverage --prefix desktop/web

      - name: Frontend build
        run: npm run build --prefix desktop/web

      - name: Web Edition build and browser-boundary scan
        run: npm run build:web --prefix desktop/web

  lidar-native:
    # GeoLibre-backed LiDAR lanes (ignored in the default suite); the engine
    # comparison lane skips itself here, as CI installs no GDAL. Fixture e2e
    # lanes stay local: they need IGN tiles.
    runs-on: ubuntu-24.04
    env:
      CANOPI_SKIP_BUNDLED_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - id: rust-toolchain
        uses: dtolnay/rust-toolchain@1.97.1
      - uses: ./.github/actions/cache-rust
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.cachekey }}
          workload: lidar-native

      - name: Install Linux dependencies
        uses: ./.github/actions/install-linux-deps

      - uses: ./.github/actions/build-geolibre-cli

      - name: LiDAR native lanes
        run: |
          export CANOPI_GEOLIBRE_BIN="$PWD/desktop/binaries/geolibre-$(rustc -vV | sed -n 's/^host: //p')"
          cargo test -p canopi-desktop --lib --locked services::lidar -- --ignored --test-threads=1 --skip e2e_

  build:
    needs: [lint, test]
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bundle_args: --bundles deb
          - os: macos-14
            target: aarch64-apple-darwin
            bundle_args: ""
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bundle_args: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle_args: ""

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: rust-toolchain
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ matrix.target }}
      - uses: ./.github/actions/cache-rust
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.cachekey }}
          workload: release
          target: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        uses: ./.github/actions/install-linux-deps

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/web/package-lock.json

      - name: Install frontend deps
        run: npm ci --prefix desktop/web

      - name: Download bundled plant DB
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          asset_name="$(python3 scripts/species_catalog_contract.py value prepared-db-asset-name)"
          download_dir="$(mktemp -d)"
          trap 'rm -rf "$download_dir"' EXIT
          mkdir -p desktop/resources
          gh release download "$CANOPI_CORE_DB_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$asset_name" \
            --dir "$download_dir"
          test -s "$download_dir/$asset_name"
          mv "$download_dir/$asset_name" desktop/resources/canopi-core.db

      - name: Verify bundled plant DB contract
        shell: bash
        run: >-
          python scripts/species_catalog_contract.py verify-db
          --profile prepared
          desktop/resources/canopi-core.db

      # The test job runs the suite on Linux only. File saving, atomic
      # replace, directory sync, locking and paths differ on Windows and
      # macOS, so the native tests run on those runners too, before packaging.
      - name: Rust tests on this platform
        if: runner.os != 'Linux'
        shell: bash
        run: cargo test --workspace --locked --target ${{ matrix.target }}

      # The sidecar must exist before `tauri build`: build.rs bundles it only
      # when desktop/binaries holds it for the target (the runner's host).
      - uses: ./.github/actions/build-geolibre-cli

      - name: Build Tauri app
        run: npx --prefix desktop/web @tauri-apps/cli build --target ${{ matrix.target }} ${{ matrix.bundle_args }} -- --locked

      - name: Windows app selects Common Controls v6
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python -m pip install --quiet pefile
          exe=$(ls target/${{ matrix.target }}/release/canopi-desktop.exe target/${{ matrix.target }}/release/canopi.exe 2>/dev/null | head -n 1)
          python scripts/check_windows_manifest.py "$exe"

      - name: Packaged sidecar runs from the installed layout
        shell: bash
        run: scripts/smoke-bundled-sidecar.sh ${{ matrix.target }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: canopi-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/bundle/**/*.deb
            target/${{ matrix.target }}/release/bundle/**/*.AppImage
            target/${{ matrix.target }}/release/bundle/**/*.dmg
            target/${{ matrix.target }}/release/bundle/**/*.msi
            target/${{ matrix.target }}/release/bundle/**/*.exe
          if-no-files-found: error
