name: PDF native WebView probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: linux
          - os: macos-14
            label: macos-arm64
          - os: macos-15-intel
            label: macos-intel
          - os: windows-latest
            label: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/pdf-evaluation/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        if: runner.os == 'Windows'
        with:
          dotnet-version: '8.0.x'
      - name: Linux native WebView and virtual display
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-gtk-3.0 gir1.2-webkit2-4.1 xvfb xauth
      - name: Build isolated fixture with pinned fonts
        working-directory: scripts/pdf-evaluation
        run: |
          npm ci --ignore-scripts
          npm run fonts
          npm run build
      - name: Run actual Linux WebKitGTK
        if: runner.os == 'Linux'
        run: xvfb-run -a /usr/bin/python3 scripts/pdf-evaluation/run_native.py scripts/pdf-evaluation/output/${{ matrix.label }}
      - name: Run actual macOS or Windows WebView
        if: runner.os != 'Linux'
        run: python scripts/pdf-evaluation/run_native.py scripts/pdf-evaluation/output/${{ matrix.label }}
      - name: Upload native PDF, report and preview evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdf-native-${{ matrix.label }}
          path: |
            scripts/pdf-evaluation/output/${{ matrix.label }}/*.pdf
            scripts/pdf-evaluation/output/${{ matrix.label }}/*.json
            scripts/pdf-evaluation/output/${{ matrix.label }}/*.png
          if-no-files-found: error
          retention-days: 14

  verify:
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install independent PDF inspector
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - uses: actions/download-artifact@v4
        with:
          pattern: pdf-native-*
          path: native-results
      - name: Verify all native files against the same reference
        run: python3 scripts/pdf-evaluation/verify_native.py native-results/pdf-native-linux native-results/pdf-native-macos-arm64 native-results/pdf-native-macos-intel native-results/pdf-native-windows
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pdf-native-verification
          path: |
            native-results/**/verification.json
            native-results/**/*-fonts.txt
          if-no-files-found: error
          retention-days: 14
