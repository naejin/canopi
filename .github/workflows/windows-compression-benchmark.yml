name: Windows compression benchmark

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/windows-compression-benchmark.yml'
      - 'scripts/windows-compression/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  benchmark:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness
      - uses: actions/checkout@v4
        with:
          ref: 8af863dfd3ec26ca3973672d0f74ef6a4576cde5
          path: payload-source
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@1.97.1
      - name: Compare identical released payloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: python harness/scripts/windows-compression/benchmark.py payload-source results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-compression-evidence
          path: results/
          if-no-files-found: error
          retention-days: 30
