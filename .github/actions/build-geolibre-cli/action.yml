name: Fetch or build the pinned GeoLibre CLI
description: >-
  Put the GeoLibre CLI at the revision pinned in scripts/build-geolibre-cli.sh
  into desktop/binaries/geolibre-<host triple>[.exe], the sidecar name Tauri
  bundles beside the application executable. The binary is downloaded from the
  release tagged geolibre-cli-<revision>; on a miss it is built from source and,
  when `publish` is true on a push to main or feature/geolibre-adoption, uploaded
  to that release so later runs skip the build. Only Build & Test's geolibre-cli
  job publishes; it alone has `contents: write`.

inputs:
  publish:
    description: Upload a freshly built binary to the revision's release (push to main or feature/geolibre-adoption only).
    default: "false"

runs:
  using: composite
  steps:
    - name: Resolve the pinned revision and sidecar name
      id: pin
      shell: bash
      run: |
        set -euo pipefail
        revision="$(sed -n 's/^REVISION=//p' scripts/build-geolibre-cli.sh)"
        test -n "$revision" || { echo "::error::no REVISION= line in scripts/build-geolibre-cli.sh" >&2; exit 1; }
        triple="$(rustc -vV | sed -n 's/^host: //p')"
        ext=""
        case "$triple" in *windows*) ext=".exe" ;; esac
        {
          echo "tag=geolibre-cli-$revision"
          echo "revision=$revision"
          echo "asset=geolibre-$triple$ext"
        } >> "$GITHUB_OUTPUT"

    - name: Download the released GeoLibre CLI
      id: download
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ steps.pin.outputs.tag }}
        ASSET: ${{ steps.pin.outputs.asset }}
      run: |
        set -uo pipefail
        mkdir -p desktop/binaries
        if gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ASSET" \
             --dir desktop/binaries --clobber && test -s "desktop/binaries/$ASSET"; then
          chmod +x "desktop/binaries/$ASSET"
          echo "hit=true" >> "$GITHUB_OUTPUT"
          echo "Downloaded $ASSET from release $TAG"
        else
          rm -f "desktop/binaries/$ASSET"
          echo "hit=false" >> "$GITHUB_OUTPUT"
          echo "No $ASSET on release $TAG; building from source"
        fi

    - name: Build the pinned GeoLibre CLI
      if: steps.download.outputs.hit != 'true'
      shell: bash
      env:
        GEOLIBRE_RUST_SRC: ${{ runner.temp }}/geolibre-rust
        GEOLIBRE_TARGET_DIR: ${{ runner.temp }}/geolibre-target
      run: scripts/build-geolibre-cli.sh

    - name: Sidecar present for this host
      shell: bash
      env:
        ASSET: ${{ steps.pin.outputs.asset }}
      run: |
        set -euo pipefail
        sidecar="desktop/binaries/$ASSET"
        test -x "$sidecar"
        "$sidecar" version

    # Another matrix leg or a concurrent run may create the release or upload
    # the same asset first; both are treated as success.
    - name: Publish the built GeoLibre CLI
      if: >-
        steps.download.outputs.hit != 'true' &&
        inputs.publish == 'true' &&
        github.event_name == 'push' &&
        (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/geolibre-adoption')
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ steps.pin.outputs.tag }}
        REVISION: ${{ steps.pin.outputs.revision }}
        ASSET: ${{ steps.pin.outputs.asset }}
      run: |
        set -euo pipefail
        if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --latest=false --title "GeoLibre CLI $REVISION" \
            --notes "GeoLibre CLI sidecars built by CI with scripts/build-geolibre-cli.sh, which CI downloads instead of rebuilding. Corresponding Source: https://github.com/opengeos/geolibre-rust/tree/$REVISION and the revisions named in desktop/THIRD_PARTY_NOTICES.md at $GITHUB_SHA." \
            || gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
        fi
        if ! gh release upload "$TAG" "desktop/binaries/$ASSET" --repo "$GITHUB_REPOSITORY"; then
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' \
            | grep -qxF "$ASSET" || { echo "::error::upload of $ASSET to $TAG failed" >&2; exit 1; }
          echo "$ASSET was uploaded by another job"
        fi
