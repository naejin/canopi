# The isolated qualification host.
#
# This crate is deliberately outside the production workspace: it has its own
# `[workspace]` table, its own lockfile and no path into `desktop/`. It reuses the
# repository's existing dependency families (Tauri, serde, sha2, tokio, tracing) at
# the versions the local registry already holds, and it reuses the production
# executor module by path rather than copying a second blocking-pool policy.
[package]
name = "qualification-desktop-host"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["sync"] }
tracing = "0.1"

[profile.dev]
# The qualification host is a measurement instrument, not a shipped binary: keep the
# build fast and debuggable, and keep this profile local to the isolated workspace.
opt-level = 1
