[package]
name = "common-types"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
design-schema = ["dep:schemars"]

[dependencies]
schemars = { version = "1.2.1", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "=2.0.0-rc.23", features = ["derive"] }

[lints.clippy]
# Runtime code returns errors; a documented invariant uses #[expect(..., reason = "...")].
unwrap_used = "deny"
expect_used = "deny"
