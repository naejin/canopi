allow-unwrap-in-tests = true
allow-expect-in-tests = true
# Native execution (AGENTS.md): threads and blocking pools belong to the
# NativeOperationExecutor. A reviewed escape carries one statement's
# `#[expect(clippy::disallowed_methods, reason = "...")]`
# (`native_command_policy::tests`).
disallowed-methods = [
    { path = "std::thread::spawn", reason = "run native work through NativeOperationExecutor" },
    { path = "std::thread::scope", reason = "run native work through NativeOperationExecutor" },
    { path = "std::thread::Builder::spawn", reason = "run native work through NativeOperationExecutor" },
    { path = "std::thread::Builder::spawn_scoped", reason = "run native work through NativeOperationExecutor" },
    { path = "tokio::task::spawn_blocking", reason = "run native work through NativeOperationExecutor" },
    { path = "tokio::task::block_in_place", reason = "run native work through NativeOperationExecutor" },
    { path = "tokio::runtime::Handle::spawn_blocking", reason = "run native work through NativeOperationExecutor" },
    { path = "tokio::runtime::Runtime::spawn_blocking", reason = "run native work through NativeOperationExecutor" },
    { path = "tauri::async_runtime::spawn_blocking", reason = "run native work through NativeOperationExecutor" },
    { path = "rayon::spawn", reason = "run native work through NativeOperationExecutor" },
    { path = "rayon::spawn_fifo", reason = "run native work through NativeOperationExecutor" },
    { path = "rayon::scope", reason = "run native work through NativeOperationExecutor" },
]
